services:
  mysql:
    image: mysql:8.4
    restart: always
    ports:
      - "0.0.0.0:3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: Svkii48XADO4atL73vkY
      MYSQL_DATABASE: idea_arena
      MYSQL_USER: idea_arena
      MYSQL_PASSWORD: Svkii48XADO4atL73vkY
    volumes:
      - ./data/mysql:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: idea-arena-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./data/sqlite:/app/data
      - ./data/logs/backend:/app/logs
      - ./data/config.yaml:/app/configs/config.yaml
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: idea-arena-frontend:latest
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NEXT_PUBLIC_API_URL=
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    environment:
      - HOSTNAME=0.0.0.0
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

