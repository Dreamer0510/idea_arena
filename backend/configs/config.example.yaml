server:
  http:
    addr: 0.0.0.0:8000
    timeout: 10s
  grpc:
    addr: 0.0.0.0:9000
    timeout: 10s

data:
  database:
    # 本地默认：sqlite
    # 线上可切换：mysql
    driver: sqlite
    # sqlite 示例: data/idea_arena.db
    # mysql 示例: user:password@tcp(127.0.0.1:3306)/idea_arena?charset=utf8mb4&parseTime=True&loc=Local
    source: data/idea_arena.db
  redis:
    addr: localhost:6379
    password: ""
    db: 0

auth:
  jwt_secret: change-me-in-production
  jwt_expire: 24h

llm:
  base_url: https://your-llm-provider.com/v1
  api_key: your-api-key-here
  default_model: qwen-plus
  max_tokens: 4096
  timeout_sec: 300
  max_retries: 4
  models:
    proposer: your-proposer-model
    opponent: your-opponent-model
    judge: your-judge-model
    utility: your-utility-model

debate:
  max_rounds: 20
  max_concurrent: 2
  timeout: 1800s
  retry_count: 3
  graduation_score: 7.5

search:
  bing:
    enabled: true
    api_key: ""
  baidu:
    enabled: true
    api_key: ""
  tavily:
    enabled: false
    api_key: ""
  serper:
    enabled: false
    api_key: ""

discovery:
  # 自动发现调度配置
  interval: 3h
  enabled: false
  topics_per_source: 10
  auto_submit_debate: false
  # 插件开关在后台配置，不在此文件：
  # /admin/discovery 或 /api/v1/admin/plugins/{name}/toggle
  # 当前内置插件：
  # - 52pojie
  # - keyword_search
  # - trend_search
  # - social_pain
  # - academic_frontier
  # - funding_signal
  # - policy_signal
  # - demand_signal
  # - llm_creative
  # 语义去重阈值（当前写死在后端逻辑）：
  # >0.85 自动过滤，0.75~0.85 人工复核，<0.75 进入自动精选

notify:
  feishu:
    enabled: false
    webhook_url: ""

registry:
  project_id: idea-arena
  project_name: "Idea Arena"
  description: "AI 创业点子辩论引擎"
  version: "1.0.0"
