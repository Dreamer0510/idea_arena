version: "3.8"

services:
  cost-monitor:
    build: .
    container_name: idea-arena-cost-monitor
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - TZ=Asia/Shanghai
    volumes:
      - ./logs:/var/log
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
